name: MLB Odds Scraper

# Driven from cron-job.org via workflow_dispatch; GitHub's own scheduler drops
# too many runs to rely on (9 of 20 on 2026-08-23).
#
#   curl -X POST -H "Accept: application/vnd.github+json" \
#     -H "Authorization: Bearer $GITHUB_PAT" \
#     https://api.github.com/repos/evanyang0612/cpbl-data/actions/workflows/mlb_odds_scheduler.yml/dispatches \
#     -d '{"ref":"main"}'
on:
  workflow_dispatch:

# Two overlapping runs would append the same snapshot twice.
concurrency:
  group: mlb-odds-scraper
  cancel-in-progress: false

jobs:
  scrape-odds:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: uv sync

      - name: Scrape MLB odds
        env:
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
          # PS3838 geo-blocks datacenter IPs; tunnel through the same
          # residential proxy the CPBL scraper uses.
          DECODO_PROXY_URL: ${{ secrets.DECODO_PROXY_URL }}
        run: uv run python -m baseball.pinnacle_odds --league mlb

      - name: Send failure Telegram message
        if: failure()
        run: |
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d "chat_id=${{ secrets.TELEGRAM_CHAT_ID }}" \
            -d "text=MLB odds scraper failed. Check: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
