name: NPB History Auditor

# Triggered from cron-job.org, not from GitHub's own scheduler. Punctuality is
# not the reason: a weekly sweep is just as useful an hour late. The reason is
# that on a public repository GitHub disables a scheduled workflow outright
# after 60 days with no repository activity — silently, which is a poor
# property for the one job whose whole purpose is noticing silent drift. The
# drift is real too: the daily MLB record job, on a "0 12 * * *" cron, landed
# 40–70 minutes late most days and twice nearly ten hours late.
#
# Fire it weekly, Monday 14:00 JST: the weekend's games are all settled by
# then, and NPB's 公式記録の訂正 for the prior week have had time to land.
#
#   curl -X POST -H "Accept: application/vnd.github+json" \
#     -H "Authorization: Bearer $GITHUB_PAT" \
#     https://api.github.com/repos/evanyang0612/cpbl-data/actions/workflows/npb_audit_scheduler.yml/dispatches \
#     -d '{"ref":"main","inputs":{"days":"30"}}'
on:
  workflow_dispatch:
    inputs:
      days:
        description: "Window size in days"
        required: false
        default: "30"

jobs:
  audit-history:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: uv sync

      # Re-scrapes ~130 games, so it is far heavier than the daily run. Yahoo
      # rate-limits the game endpoints from a residential IP well before this
      # finishes; Actions runners have not hit that.
      - name: Audit recent NPB games against the sheets
        env:
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: >
          uv run python migration/audit_npb_history.py
          --days ${{ github.event.inputs.days || '30' }}
          --write-sheet
          --notify

      - name: Upload the audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: npb-audit-report
          path: .cache/npb_audit_*.json
          if-no-files-found: ignore

      - name: Send failure Telegram message
        if: failure()
        run: |
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d "chat_id=${{ secrets.TELEGRAM_CHAT_ID }}" \
            -d "text=NPB history auditor failed. Check: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
