name: NPB Odds Scraper

on:
  schedule:
    # Every 30 min, 01:00–10:30 UTC (10:00–19:30 JST). Covers the pre-game
    # window for both 14:00 and 18:00 JST first pitches, capturing the line
    # from open through the closing price just before each game starts.
    # Once a game goes live it moves to the feed's live bucket and is skipped,
    # so only pre-game snapshots are recorded.
    - cron: "*/30 1-10 * * *"
  workflow_dispatch:

jobs:
  scrape-odds:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: uv sync

      - name: Scrape NPB odds
        env:
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
        run: uv run python -m baseball.pinnacle_odds

      - name: Send failure Telegram message
        if: failure()
        run: |
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d "chat_id=${{ secrets.TELEGRAM_CHAT_ID }}" \
            -d "text=NPB odds scraper failed. Check: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
