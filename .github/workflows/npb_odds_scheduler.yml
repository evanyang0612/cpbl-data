name: NPB Odds Scraper

# Driven from cron-job.org via workflow_dispatch, on the half hour around the
# clock. GitHub's own scheduler is not used: it drops a large share of runs — a
# */30 cron fired 9 times out of 20 on 2026-08-23, and its first run of the day
# landed 90 minutes late, which is how the early games came to be missing from
# the ledger.
#
# The useful window is now most of the day. Reading the whole board, the next
# day's slate reaches 早盤 once tonight's games finish, and a game leaves the
# pre-game bucket at its own first pitch — so captures run from one evening
# through to the last first pitch of the following afternoon.
#
#   curl -X POST -H "Accept: application/vnd.github+json" \
#     -H "Authorization: Bearer $GITHUB_PAT" \
#     https://api.github.com/repos/evanyang0612/cpbl-data/actions/workflows/npb_odds_scheduler.yml/dispatches \
#     -d '{"ref":"main"}'
on:
  workflow_dispatch:

# Two overlapping runs would append the same snapshot twice.
concurrency:
  group: npb-odds-scraper
  cancel-in-progress: false

jobs:
  scrape-odds:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: uv sync

      - name: Scrape NPB odds
        env:
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
          # PS3838 geo-blocks datacenter IPs; tunnel through the same
          # residential proxy the CPBL scraper uses.
          DECODO_PROXY_URL: ${{ secrets.DECODO_PROXY_URL }}
        run: uv run python -m baseball.pinnacle_odds

      - name: Send failure Telegram message
        if: failure()
        run: |
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d "chat_id=${{ secrets.TELEGRAM_CHAT_ID }}" \
            -d "text=NPB odds scraper failed. Check: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
