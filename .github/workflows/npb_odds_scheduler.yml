name: NPB Odds Scraper

# Driven from cron-job.org via workflow_dispatch. GitHub's own scheduler drops
# a large share of runs — a */30 cron fired 9 times out of 20 on 2026-08-23,
# and its first run of the day landed 90 minutes late, which is how the early
# games came to be missing from the ledger. The schedules below are kept only
# as a fallback so nothing stops entirely if the external trigger is not set up.
on:
  schedule:
    # 01:00–10:30 UTC (10:00–19:30 JST): the run-up to first pitch.
    - cron: "*/30 1-10 * * *"
    # 12:00–16:30 UTC (21:00–01:30 JST): the next day's slate reaches the 早盤
    # board once tonight's games finish, and that is the opening price. The old
    # window stopped before it, back when the scraper read only the 今日 board
    # and a game could not be seen until its own day began.
    - cron: "*/30 12-16 * * *"
  workflow_dispatch:

# Two overlapping runs would append the same snapshot twice.
concurrency:
  group: npb-odds-scraper
  cancel-in-progress: false

jobs:
  scrape-odds:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: uv sync

      - name: Scrape NPB odds
        env:
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
          # PS3838 geo-blocks datacenter IPs; tunnel through the same
          # residential proxy the CPBL scraper uses.
          DECODO_PROXY_URL: ${{ secrets.DECODO_PROXY_URL }}
        run: uv run python -m baseball.pinnacle_odds

      - name: Send failure Telegram message
        if: failure()
        run: |
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d "chat_id=${{ secrets.TELEGRAM_CHAT_ID }}" \
            -d "text=NPB odds scraper failed. Check: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
