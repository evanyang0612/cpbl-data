name: MLB Record Updater

# Triggered from cron-job.org, not from GitHub's own scheduler: on a
# "0 12 * * *" cron this job landed 40–70 minutes late most days, and on
# 2026-08-27 and 08-28 nearly ten hours late — by which point it is writing a
# different day's games than the one it was aimed at.
#
# Fire it daily at 21:00 JST, which catches most finalized MLB day games. The
# job retries recent dates by gamePk, so a late run — or a repeated one — skips
# rows already written rather than doubling them.
#
#   curl -X POST -H "Accept: application/vnd.github+json" \
#     -H "Authorization: Bearer $GITHUB_PAT" \
#     https://api.github.com/repos/evanyang0612/cpbl-data/actions/workflows/mlb_record_scheduler.yml/dispatches \
#     -d '{"ref":"main"}'
on:
  workflow_dispatch:

jobs:
  update-record:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: uv sync

      # 近十場 first, the way NPB runs its 近十場 before writing 賽錄. It takes
      # nothing from 紀錄 any more, but it writes five sheets of its own, and a
      # write to this workbook has to wait out the recalculation the previous
      # one started -- minutes, at this size.
      - name: Run MLB last-10 updater
        env:
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
        run: |
          uv run python migration/update_mlb_last10.py 2>&1 | tee -a mlb-job.log

      # Thirty days, not three: the official scorer revises hits, errors and
      # earned runs well after the night in question, and a game already in
      # 紀錄 is otherwise never looked at again. Over sixty days that left 94
      # stale values across 756 games. The window costs one concurrent sweep
      # of the feeds and still writes once.
      - name: Run MLB record updater
        env:
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
        run: |
          uv run python migration/update_mlb_record.py --recent-days 30 \
            2>&1 | tee -a mlb-job.log

      # 12:00 UTC is 08:00 ET, by which point the day's probables are announced
      # (tomorrow's usually are too; two days out they rarely are).
      # Runs even if an earlier step failed: 設定 going stale is worse than it
      # being filled on a day 紀錄 could not be updated.
      - name: Fill 設定 with probable starters and refresh the 先発 lists
        if: always()
        env:
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
        run: |
          uv run python migration/update_mlb_probables.py 2>&1 | tee -a mlb-job.log

      - name: Upload job log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mlb-job-log
          path: mlb-job.log
          if-no-files-found: warn

      # A timeout cancels the job rather than failing it, so failure() alone
      # stayed silent through five straight days of 20-minute timeouts.
      - name: Send failure Telegram message
        if: failure() || cancelled()
        run: |
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d "chat_id=${{ secrets.TELEGRAM_CHAT_ID }}" \
            -d "text=MLB record updater failed. Check: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
