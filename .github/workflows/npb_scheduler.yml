name: NPB Schedule Updater

on:
  workflow_dispatch:

jobs:
  update-sheet:
    runs-on: ubuntu-latest
    # Typical sweeps finish in 4-7 minutes. Ten left no room for a Sheets
    # 503 storm, and four runs in three days were cancelled at 10.3 minutes
    # inside one — see baseball/sheets.py MAX_RUN_WAIT, which now gives up
    # loudly at three minutes of cumulative retrying rather than letting the
    # job be axed silently.
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: uv sync

      - name: Run NPB updater
        env:
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
        run: uv run python npb.py

      # 紀錄總表 lives in a separate workbook and is a mirror of 分析表紀錄, which
      # the step above has just written — so it belongs here rather than on a
      # schedule of its own, the way mlb_record_scheduler.yml chains its three
      # scripts. Running it on every sweep keeps 紀錄總表 no more than 30 minutes
      # behind, and a sweep with nothing new writes nothing.
      #
      # continue-on-error because the target workbook is owned by someone else:
      # a permission change there must not turn the NPB updater red, and the
      # alert below would name the wrong job if it did.
      - name: Mirror 分析表紀錄 into 紀錄總表
        id: record_sync
        continue-on-error: true
        env:
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
        run: uv run python baseball/npb_record_sync.py

      - name: Send 紀錄總表 failure Telegram message
        if: steps.record_sync.outcome == 'failure'
        run: |
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d "chat_id=${{ secrets.TELEGRAM_CHAT_ID }}" \
            -d "text=NPB 紀錄總表 mirror failed (the sweep itself was fine). Check: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

      # The diary's オープン戦 starters cost ~230 npb.jp requests to sweep, and
      # the first run after 開幕 does it once and writes
      # baseball/data/npb_preseason_<year>.json. A runner starts clean, so the
      # file is carried from run to run here; without it every run would sweep.
      - name: Restore the diary's オープン戦 starters
        uses: actions/cache@v4
        with:
          path: baseball/data
          key: npb-diary-data-${{ github.run_id }}
          restore-keys: npb-diary-data-

      # Same shape as the mirror above, and it rides along every 30 minutes for
      # the same kind of reason: only the days around today are rebuilt, so
      # Yahoo is asked for about two dozen schedule pages instead of the
      # season's 260-odd. The season itself is read off npb.jp each run, so a
      # new year's tab starts on its own; from March on, a season npb.jp has no
      # schedule for fails the step and the alert below fires. A --full
      # rebuild is a manual job, for when the layout itself changes.
      - name: Update 野球日記
        id: diary
        continue-on-error: true
        env:
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
        run: uv run python baseball/npb_diary.py

      - name: Send 野球日記 failure Telegram message
        if: steps.diary.outcome == 'failure'
        run: |
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d "chat_id=${{ secrets.TELEGRAM_CHAT_ID }}" \
            -d "text=NPB 野球日記 update failed (the sweep itself was fine). Check: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

      # Yahoo's pinpoint forecast covers today and nothing else, and npb.jp's
      # box scores carry no weather at all, so a reading missed on the day
      # cannot be recovered afterwards. Riding along on every sweep is what
      # makes the last reading before first pitch the one that gets kept.
      - name: Record today's weather
        id: weather
        continue-on-error: true
        env:
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
        run: uv run python -m baseball.npb_weather

      - name: Send 天氣 failure Telegram message
        if: steps.weather.outcome == 'failure'
        run: |
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d "chat_id=${{ secrets.TELEGRAM_CHAT_ID }}" \
            -d "text=NPB 天氣 log failed (the sweep itself was fine). Check: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"


      - name: Telegram on failure or cancellation
        if: failure() || cancelled()
        run: |
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d "chat_id=${{ secrets.TELEGRAM_CHAT_ID }}" \
            -d "text=NPB updater ${{ job.status }}. Check: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
